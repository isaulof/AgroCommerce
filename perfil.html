<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="marca.svg">
  <title>AgroCommerce — Meu Perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>

<nav class="m-nav">
  <div class="m-nav-inner">
    <a href="marketplace.html" class="m-nav-back"><i class="fa-solid fa-arrow-left"></i> Marketplace</a>
    <a href="marketplace.html" class="m-nav-logo">
      <div class="mark"><i class="fa-solid fa-seedling"></i></div>
      <span class="m-nav-logo-name">AGRO<span>COMMERCE</span></span>
    </a>
    <div class="m-nav-actions">
      <a href="carrinho.html" class="nav-cart-btn" aria-label="Carrinho">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <button class="m-nav-user-btn" id="navUserBtn">
        <span id="navUserAvatar"></span>
        <span id="navUserName">Entrar</span>
        <i class="fa-solid fa-chevron-down" style="font-size:.6rem;color:rgba(255,255,255,.4)"></i>
      </button>
    </div>
    <button class="m-nav-hamburger" id="navHamburger"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="profile-wrap">
  <div class="profile-header" id="profileHeader"></div>

  <div class="profile-grid">
    <!-- Coluna principal: abas -->
    <div>
      <!-- Tabs -->
      <div style="display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--gray-200,#e0e0e0)">
        <button class="btn btn-ghost btn-sm" id="tabBtnOrders" style="border-radius:6px 6px 0 0;border-bottom:2px solid var(--green-600,#388e3c);margin-bottom:-2px;color:var(--green-700,#2e7d32);font-weight:700">
          <i class="fa-solid fa-bag-shopping"></i> Meus Pedidos
        </button>
        <button class="btn btn-ghost btn-sm" id="tabBtnFavs" style="border-radius:6px 6px 0 0">
          <i class="fa-solid fa-heart"></i> Favoritos
        </button>
      </div>

      <!-- Tab: Pedidos -->
      <div id="tabOrders"></div>

      <!-- Tab: Favoritos -->
      <div id="tabFavs" style="display:none">
        <div style="text-align:center;padding:48px 24px;color:var(--gray-400)">
          <i class="fa-solid fa-heart" style="font-size:2.5rem;margin-bottom:12px;display:block;opacity:.3"></i>
          <p style="font-size:.9rem">Seus produtos favoritos aparecerão aqui.</p>
          <a href="marketplace.html" class="btn btn-outline btn-sm" style="margin-top:16px">Explorar produtos</a>
        </div>
      </div>
    </div>

    <!-- Coluna lateral -->
    <div>
      <div class="profile-panel" id="profileSidebar"></div>
    </div>
  </div>
</div>

<footer class="m-footer">
  <div class="m-footer-inner">
    <div class="m-footer-logo">AGRO<span>COMMERCE</span></div>
    <p class="m-footer-copy">&copy; 2026 AgroCommerce &mdash; Todos os direitos reservados.</p>
    <a href="index.html" class="m-footer-link">Voltar ao site</a>
  </div>
</footer>

<!-- Modal Login -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Selecionar Perfil</div>
        <div class="modal-subtitle">Escolha com qual perfil deseja entrar</div>
      </div>
      <button class="modal-close" id="loginClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="user-list" id="loginUserList"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
